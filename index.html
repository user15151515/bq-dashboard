    <div class="stack" style="margin-bottom:12px">${tp.filter(t => t.v).map(t => `<i style="flex:${t.v};background:${t.c}" data-tip="${esc(`${t.k}: ${t.v} pts (${nf(t.v / tot * 100, 0)}%)`)}">${t.v / tot > .12 ? nf(t.v / tot * 100, 0) + '%' : ''}</i>`).join('') || '<i style="flex:1;background:var(--surface2)"></i>'}</div>
    ${hbars(tp.map(t => ({ label: t.k === '2P' ? 'Tiros de 2' : t.k === '3P' ? 'Triples' : 'Tiros libres', v: t.v, color: t.c, sub: t.k === 'TL' ? `${p.ftm}/${p.fta}` : `×${t.n}` })), { max: Math.max(1, ...tp.map(t => t.v)), fmt: v => nf(v, 0) + ' pts' })}
    <div class="mini" style="margin:14px 0 0;grid-template-columns:repeat(3,minmax(0,1fr))">${['pin', 'med', 'tri'].map(z => `<div><span>${ZN[z]}</span><b>${zc[z]}</b></div>`).join('')}</div></div></div>`;

  // rotation
  const st = []; mine.filter(g => g.detail).forEach(g => (g.stints[p.id] || []).forEach(s => st.push({ ...s, g })));
  const nSt = st.length, avgSt = nSt ? sum(st, s => s.e - s.s) / nSt : null;
  const rests = []; mine.filter(g => g.detail).forEach(g => { const a = g.stints[p.id] || []; for (let i = 1; i < a.length; i++) rests.push(a[i].s - a[i - 1].e); });
  const firstIn = mine.filter(g => g.detail && (g.stints[p.id] || []).length).map(g => g.stints[p.id][0].s);
  const longest = st.reduce((b, s) => !b || (s.e - s.s) > (b.e - b.s) ? s : b, null);
  const rotMini = `<div class="mini">
    <div><span>Tramos / partido</span><b>${mine.length ? nf(nSt / mine.length, 1) : '—'}</b></div>
    <div><span>Duración media</span><b>${avgSt ? mmss(avgSt) : '—'}</b></div>
    <div><span>Descanso medio</span><b>${rests.length ? mmss(sum(rests) / rests.length) : '—'}</b></div>
    <div><span>Primera entrada</span><b>${firstIn.length ? (firstIn.every(t => t === 0) ? 'Titular' : 'min ' + nf(sum(firstIn) / firstIn.length / 60, 1)) : '—'}</b></div>
    <div><span>Tramo más largo</span><b>${longest ? mmss(longest.e - longest.s) : '—'}<small>${longest ? 'J' + longest.g.j : ''}</small></b></div></div>`;
  const rotGantts = chart((el, W) => {
    el.innerHTML = '';
    const gg = mine.filter(g => g.detail);
    if (!gg.length) { el.innerHTML = '<div class="empty">Sin datos</div>'; return; }
    const L0 = Math.max(...gg.map(g => g.len)), ref = gg.find(g => g.len === L0);
    const hd = document.createElement('div'); el.appendChild(hd);
    gantt(hd, W, ref, [], 76, L0);
    gg.forEach(g => {
      const d = document.createElement('div'); el.appendChild(d);
      gantt(d, W, g, [{ label: `J${g.j} ${g.home ? '' : '@'}${g.code}`, full: `J${g.j} · ${g.opp}`, stints: g.stints[p.id], fouls: g.fouls.filter(f => f.id === p.id) }], 76, L0, true);
    });
  });

  // fouls detail
  const fl = mine.filter(g => g.detail).map(g => ({ g, f: g.fouls.filter(f => f.id === p.id).sort((a, b) => a.t - b.t) }));
  const byQ = {}; fl.forEach(x => x.f.forEach(f => byQ[f.p] = (byQ[f.p] || 0) + 1));
  const loaded = [0, 0, 0, 0, 0, 0];
  fl.forEach(({ g, f }) => (g.stints[p.id] || []).forEach(s => {
    const cuts = [s.s, ...f.map(z => z.t).filter(t => t > s.s && t < s.e), s.e];
    for (let i = 0; i < cuts.length - 1; i++) { const mid = (cuts[i] + cuts[i + 1]) / 2, c = f.filter(z => z.t <= mid).length; loaded[Math.min(5, c)] += cuts[i + 1] - cuts[i]; }
  }));
  const totL = sum(loaded) || 1;
  const fcol = ['var(--surface3)', 'color-mix(in srgb,var(--red) 25%,var(--surface2))', 'color-mix(in srgb,var(--red) 50%,var(--surface2))', 'color-mix(in srgb,var(--red) 75%,var(--surface2))', 'var(--red)', 'var(--text)'];
  const maxQ = Math.max(4, ...Object.keys(byQ).map(Number));
  const fouls = `<div class="mini">
      <div><span>Faltas / partido</span><b>${nf(p.fc / (p.gp - p.partial || 1), 1)}</b></div>
      <div><span>Faltas / 40'</span><b>${nf(per40(p.fc, p.sec), 1)}</b></div>
      <div><span>Minutos por falta</span><b>${p.fc ? nf(p.sec / 60 / p.fc, 1) : '—'}</b></div>
      <div><span>Eliminada</span><b>${fl.filter(x => x.f.length >= 5).length}<small>veces</small></b></div></div>
    <div class="muted" style="font-size:12px;margin-bottom:6px">Por cuarto</div>
    ${hbars(Array.from({ length: maxQ }, (_, i) => ({ label: pLabel(i + 1), v: byQ[i + 1] || 0, color: 'var(--red)' })), { max: Math.max(1, ...Object.values(byQ)), fmt: v => nf(v, 0) })}
    <div class="muted" style="font-size:12px;margin:14px 0 6px">Minutos jugados según faltas acumuladas</div>
    <div class="stack">${loaded.map((s, i) => s > 0 ? `<i style="flex:${s};background:${fcol[i]};color:${i < 2 ? 'var(--text)' : '#fff'}" data-tip="${esc(`Con ${i}${i === 5 ? '+' : ''} falta${i === 1 ? '' : 's'}: ${mmss(s)} min (${nf(s / totL * 100, 0)}%)`)}">${s / totL > .1 ? i + 'F' : ''}</i>` : '').join('')}</div>
    <div class="lg">${loaded.map((s, i) => s > 0 ? `<span><i style="background:${fcol[i]}"></i>${i}F · ${mmss(s)}</span>` : '').join('')}</div>`;

  // chemistry
  const pr = {};
  A.L.forEach(l => { if (!l.ids.includes(p.id)) return; l.ids.forEach(o => { if (o === p.id) return; const x = pr[o] || (pr[o] = { sec: 0, pm: 0 }); x.sec += l.sec; x.pm += l.pm; }); });
  let chemRows = Object.entries(pr).map(([o, x]) => ({ o, ...x, q: A.P[o], p40: per40(x.pm, x.sec) })).filter(r => r.q);
  chemRows.sort(S.chem === 'pm' ? (a, b) => (b.sec >= 120) - (a.sec >= 120) || b.p40 - a.p40 : (a, b) => b.sec - a.sec);
  const cmax = Math.max(10, ...chemRows.filter(r => r.sec >= 120).map(r => Math.abs(r.p40)));
  const chem = chemRows.length ? hbars(chemRows.map(r => ({ label: r.q.nick, v: r.p40, dim: r.sec < 120,
      sub: `${nf(r.sec / 60, 0)}'`, tip: `<b>${esc(p.first)} + ${esc(r.q.name)}</b><br>${mmss(r.sec)} min juntas · ${sgn(r.pm)}<br>${sgn(r.p40, 1)} por 40'${r.sec < 120 ? '<br><span class="tm">Muestra pequeña</span>' : ''}` })),
      { signed: true, max: cmax, fmt: v => sgn(v, 1) })
    + `<div class="lg"><span><i style="background:var(--blue)"></i>+/− por 40' juntas</span><span class="muted">minutos juntas a la derecha · atenuado &lt; 2'</span></div>` : '<div class="empty">Sin datos de quintetos</div>';

  return head + kp + `<div class="grid" style="margin-top:12px">
    ${card('s8', 'Partido a partido', perGame, seg('pgMetric', pgOpts, S.pgMetric))}
    ${card('s4', 'Impacto en pista', impact, '', "+/− por 40'")}
    ${card('s7', 'Minutos por cuarto', heat)}
    ${card('s5', 'Tipo de puntos', ptsType)}
    ${card('s12', 'Rotación', rotMini + `<div class="muted" style="font-size:12px;margin-bottom:4px">Probabilidad de estar en pista en cada momento del partido</div>` + chart((el, W) => presence(el, W, gs, p.id)) +
      `<div class="muted" style="font-size:12px;margin:14px 0 2px">Tramos por partido · color = +/− del tramo · ① faltas</div>` + rotGantts)}
    ${card('s6', 'Faltas', fouls)}
    ${card('s6', 'Química', chem, seg('chem', [['sec', 'Más minutos'], ['pm', 'Mejor +/−']], S.chem), "+/− por 40' juntas")}
  </div>`;
}

/* ---------- EQUIPO ---------- */
function viewEquipo() {
  const gs = activeGames(); if (!gs.length) return emptyState('No hay partidos seleccionados.');
  const A = agg(gs), T = A.T, n = T.gp;
  const k = (l, v, s = '') => `<div class="kpi"><div class="l"><span>${l}</span></div><div class="v">${v}</div><div class="f">${s}</div></div>`;
  const kp = `<div class="kpis fade" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
    ${k('Balance', `${T.w}–${T.l}`, `${n} partido${n > 1 ? 's' : ''}`)}
    ${k('Puntos a favor', nf(T.pf / n, 1), `${T.pf} total`)}
    ${k('Puntos en contra', nf(T.pa / n, 1), `${T.pa} total`)}
    ${k('Diferencia', sgn((T.pf - T.pa) / n, 1), `${sgn(T.pf - T.pa)} total`)}
    ${k('Tiros libres', ok(pct(T.ftm, T.fta)) ? nf(pct(T.ftm, T.fta), 0) + '<small>%</small>' : '—', `${T.ftm}/${T.fta}`)}
    ${k('Faltas', nf(T.fc / n, 1), `rival ${nf(T.ofc / n, 1)}`)}
  </div>`;

  // games strip, oldest left → newest right
  const act = new Set(gs.map(g => g.n));
  const games = `<div class="games">${M.games.map(g => `<button class="game ${act.has(g.n) ? '' : 'off'}" data-act="game" data-n="${g.n}">
    <div class="gt"><span>J${g.j} · ${fdate(g.date)}</span><span>${g.home ? 'Casa' : 'Fuera'}</span></div>
    <div class="go">${esc(g.opp)}</div>
    <div class="gs"><span class="wl ${g.res}">${g.res === 'W' ? 'V' : g.res === 'L' ? 'D' : 'E'}</span><b>${g.pf}–${g.pa}</b><span class="dif">${sgn(g.diff)}</span></div></button>`).join('')}</div>`;

  // roster table
  const tm = S.tmode;
  const v = (p, key) => key === 'min' ? (tm === 'tot' ? p.sec / 60 : p.sec / 60 / p.gp) : mv(p, key, tm);
  const d = tm === 'tot' ? 0 : 1;
  const cols = [
    ['name', 'Jugadora', p => p.name],
    ['gp', 'PJ', p => p.gp, p => p.gp],
    ['gs', 'Tit', p => p.gs, p => p.gs],
    ['min', tm === 'tot' ? 'Min' : 'Min/p', p => v(p, 'min'), p => tm === 'tot' ? mmss(p.sec) : nf(v(p, 'min'), 1), true],
    ['pts', 'Pts', p => v(p, 'pts'), p => nf(v(p, 'pts'), d), true],
    ['t2m', '2P', p => v(p, 't2m'), p => nf(v(p, 't2m'), d)],
    ['t3m', '3P', p => v(p, 't3m'), p => nf(v(p, 't3m'), d)],
    ['ftm', 'TL', p => v(p, 'ftm'), p => tm === 'tot' ? `${p.ftm}<span class="sub">/${p.fta}</span>` : `${nf(v(p, 'ftm'), 1)}<span class="sub">/${nf(v(p, 'fta'), 1)}</span>`],
    ['ftp', 'TL%', p => p.fta ? pct(p.ftm, p.fta) : -1, p => p.fta ? nf(pct(p.ftm, p.fta), 0) : '—'],
    ['fc', 'F', p => v(p, 'fc'), p => nf(v(p, 'fc'), d)],
    ['pm', '+/−', p => v(p, 'pm'), p => pmHtml(v(p, 'pm'), d)],
  ];
  const sc = cols.find(c => c[0] === S.sort.k) || cols[3];
  const rows = Object.values(A.P).sort((a, b) => { const x = sc[2](a), y = sc[2](b); return (typeof x === 'string' ? x.localeCompare(y) : (x ?? -1e9) - (y ?? -1e9)) * S.sort.d; });
  const bmax = {}; cols.filter(c => c[4]).forEach(c => bmax[c[0]] = Math.max(1e-9, ...rows.map(r => c[2](r) || 0)));
  const table = `<div class="tw"><table><thead><tr>${cols.map(c => `<th class="s ${S.sort.k === c[0] ? 'on' : ''}" data-act="sort" data-k="${c[0]}">${c[1]}${S.sort.k === c[0] ? (S.sort.d < 0 ? ' ↓' : ' ↑') : ''}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(p => `<tr class="${p.id === CFG.me ? 'me' : ''}">${cols.map(c => c[0] === 'name'
      ? `<td class="nm" data-act="toPlayer" data-id="${p.id}"><span class="dor">${p.dorsal}</span>${esc(p.name)}</td>`
      : c[4] ? `<td class="cellbar" style="--w:${clamp((c[2](p) || 0) / bmax[c[0]], 0, 1) * 70}%"><span>${c[3](p)}</span></td>` : `<td>${c[3](p)}</td>`).join('')}</tr>`).join('')}
    <tr class="tot"><td>Equipo</td><td>${n}</td><td></td><td>${tm === 'tot' ? mmss(T.sec) : nf(T.sec / 60 / n, 1)}</td><td>${tm === 'tot' ? T.pf : tm === 'pg' ? nf(T.pf / n, 1) : nf(per40(T.pf, T.sec), 1)}</td>
      <td>${tm === 'tot' ? T.t2m : tm === 'pg' ? nf(T.t2m / n, 1) : nf(per40(T.t2m, T.sec), 1)}</td><td>${tm === 'tot' ? T.t3m : tm === 'pg' ? nf(T.t3m / n, 1) : nf(per40(T.t3m, T.sec), 1)}</td>
      <td>${tm === 'tot' ? `${T.ftm}/${T.fta}` : tm === 'pg' ? `${nf(T.ftm / n, 1)}/${nf(T.fta / n, 1)}` : `${nf(per40(T.ftm, T.sec), 1)}/${nf(per40(T.fta, T.sec), 1)}`}</td><td>${nf(pct(T.ftm, T.fta), 0)}</td>
      <td>${tm === 'tot' ? T.fc : tm === 'pg' ? nf(T.fc / n, 1) : nf(per40(T.fc, T.sec), 1)}</td><td>${sgn(tm === 'tot' ? T.pf - T.pa : tm === 'pg' ? (T.pf - T.pa) / n : per40(T.pf - T.pa, T.sec), d)}</td></tr>
    </tbody></table></div><div class="lg"><span><span class="st" style="margin:0"></span></span><span class="muted">Clic en una jugadora para ver su ficha · ${tm === 'p40' ? "por 40' = ritmo por cada 40 minutos en pista" : tm === 'pg' ? 'media por partido jugado' : 'acumulado'}</span></div>`;

  // minutes share
  const shOpts = [['tot', 'Total'], ['pg', 'Media'], ...gs.map(g => [String(g.n), 'J' + g.j])];
  if (!shOpts.some(o => o[0] === S.share)) S.share = 'tot';
  let shareRows;
  if (S.share === 'tot' || S.share === 'pg') shareRows = Object.values(A.P).map(p => ({ p, s: S.share === 'tot' ? p.sec : p.sec / n }));
  else { const g = gs.find(x => String(x.n) === S.share); shareRows = Object.entries(g.players).filter(([, x]) => x.sec > 0).map(([id, x]) => ({ p: A.P[id] || { name: (M.names[id] || {}).name, nick: (M.names[id] || {}).name, id, dorsal: '' }, s: x.sec })); }
  shareRows.sort((a, b) => b.s - a.s);
  const shTot = sum(shareRows, r => r.s) || 1;
  const share = `<div class="stack" style="margin-bottom:14px">${shareRows.map(r => `<i style="flex:${r.s};background:${r.p.id === CFG.me ? 'var(--me)' : 'var(--blue)'};opacity:${r.p.id === CFG.me ? 1 : .35 + .65 * r.s / shareRows[0].s}" data-tip="${esc(`<b>${r.p.name}</b><br>${mmss(r.s)} min · ${nf(r.s / shTot * 100, 1)}%`)}">${r.s / shTot > .06 ? r.p.dorsal : ''}</i>`).join('')}</div>
    ${hbars(shareRows.map(r => ({ label: r.p.nick || r.p.name, me: r.p.id === CFG.me, v: r.s / 60, color: r.p.id === CFG.me ? 'var(--me)' : 'var(--blue)', sub: nf(r.s / shTot * 100, 0) + '%', tip: `${esc(r.p.name)}: ${mmss(r.s)}` })), { max: S.share === 'tot' ? Math.max(...shareRows.map(r => r.s / 60)) : 40, fmt: v => nf(v, 1) + "'" })}`;

  // quarters
  const qs = Object.entries(T.per).sort((a, b) => a[0] - b[0]);
  const qm = Math.max(10, ...qs.map(([, x]) => Math.max(x.us, x.them) / x.n));
  const quarters = `<div class="tw"><table><thead><tr><th>Cuarto</th><th>A favor</th><th></th><th>En contra</th><th>Dif.</th><th>Ganados</th></tr></thead><tbody>
    ${qs.map(([k, x]) => { const won = gs.filter(g => (g.periods || []).some(q => q.p == k && q.us > q.them)).length; const df = (x.us - x.them) / x.n;
      return `<tr><td>${pLabel(+k)}</td><td>${nf(x.us / x.n, 1)}</td><td style="width:40%"><div style="display:flex;gap:2px;height:12px"><div style="flex:1;display:flex;justify-content:flex-end"><i style="display:block;width:${x.us / x.n / qm * 100}%;background:var(--blue);border-radius:3px 0 0 3px"></i></div><div style="flex:1"><i style="display:block;height:100%;width:${x.them / x.n / qm * 100}%;background:var(--red);border-radius:0 3px 3px 0"></i></div></div></td><td>${nf(x.them / x.n, 1)}</td><td>${pmHtml(df, 1)}</td><td>${won}/${x.n}</td></tr>`; }).join('')}
    </tbody></table></div><div class="lg"><span><i style="background:var(--blue)"></i>Claret</span><span><i style="background:var(--red)"></i>Rival</span><span class="muted">media por partido</span></div>`;

  // lineups
  let lus = A.L.map(l => ({ ...l, p40: per40(l.pm, l.sec) }));
  if (S.luMin === 'me') lus = lus.filter(l => l.ids.includes(CFG.me));
  lus.sort(S.luSort === 'pm' ? (a, b) => b.pm - a.pm || b.sec - a.sec : S.luSort === 'p40' ? (a, b) => (b.sec >= 300) - (a.sec >= 300) || b.p40 - a.p40 : (a, b) => b.sec - a.sec);
  lus = lus.slice(0, 12);
  const lineups = lus.length ? `<div class="tw"><table><thead><tr><th>Quinteto</th><th>Min</th><th>Partidos</th><th>+/−</th><th>+/− 40'</th></tr></thead><tbody>
    ${lus.map(l => `<tr><td><div class="lu">${l.ids.map(id => ({ id, d: (M.names[id] || {}).dorsal || '?', nm: (M.names[id] || {}).name || '' })).sort((a, b) => a.d - b.d).map(x => `<span class="${x.id === CFG.me ? 'me' : ''}" data-tip="${esc(x.nm)}">${x.d}</span>`).join('')}</div></td>
      <td>${mmss(l.sec)}</td><td>${l.g.size}</td><td>${pmHtml(l.pm)}</td><td class="${l.sec < 300 ? 'muted' : ''}">${sgn(l.p40, 1)}</td></tr>`).join('')}</tbody></table></div><div class="lg"><span class="muted">+/− 40' atenuado con menos de 5 minutos juntas</span></div>` : '<div class="empty">Sin quintetos</div>';

  // shots
  const side = S.shot;
  const all = gs.flatMap(g => (side === 'us' ? g.shotsUs : g.shotsThem).map(s => ({ ...s, G: g })));
  const shooters = [...new Set(all.map(s => s.id).filter(Boolean))].map(id => A.P[id] || { id, name: (M.names[id] || {}).name, dorsal: (M.names[id] || {}).dorsal }).sort((a, b) => a.dorsal - b.dorsal);
  if (side !== 'us') S.shotP = 'all';
  const fs = all.filter(s => (S.shotP === 'all' || s.id === S.shotP) && (S.shotT === 'all' || s.type === S.shotT) && (S.shotQ === 'all' || String(s.per) === S.shotQ))
    .map(s => ({ ...s, tip: `<b>${s.type === 'T3' ? 'Triple' : 'Canasta de 2'}</b> · ${ZN[s.zone]}${s.id ? '<br>' + esc((M.names[s.id] || {}).name || '') : s.dorsal ? `<br><span class="tm">Rival #${s.dorsal}</span>` : ''}<br><span class="tm">J${s.G.j} ${esc(s.G.code)} · ${pLabel(s.per)}</span>` }));
  const zc = ['pin', 'med', 'tri'].map(z => ({ z, n: fs.filter(s => s.zone === z).length, pts: fs.filter(s => s.zone === z).length * (z === 'tri' ? 3 : 2) }));
  const maxQ = Math.max(4, ...gs.map(g => (g.periods || []).length));
  const shotCtl = `<div class="ctrls">${seg('shot', [['us', 'Ataque'], ['them', 'Defensa']], side)}
    ${side === 'us' ? `<select data-act="sel" data-k="shotP"><option value="all">Todas</option>${shooters.map(p => `<option value="${p.id}" ${S.shotP === p.id ? 'selected' : ''}>${p.dorsal} · ${esc(p.name)}</option>`).join('')}</select>` : ''}
    <select data-act="sel" data-k="shotT"><option value="all">2P y 3P</option><option value="T2" ${S.shotT === 'T2' ? 'selected' : ''}>Solo 2P</option><option value="T3" ${S.shotT === 'T3' ? 'selected' : ''}>Solo 3P</option></select>
    <select data-act="sel" data-k="shotQ"><option value="all">Todos los cuartos</option>${Array.from({ length: maxQ }, (_, i) => `<option value="${i + 1}" ${S.shotQ === String(i + 1) ? 'selected' : ''}>${pLabel(i + 1)}</option>`).join('')}</select></div>`;
  const cA = side === 'us' ? 'var(--blue)' : 'var(--red)';
  const shots = `<div class="split"><div>${court(fs, s => s.type === 'T3' ? '#eb6834' : cA, `<span><i class="c" style="background:${cA}"></i>2P</span><span><i class="c" style="background:#eb6834"></i>3P</span><span class="muted">${fs.length} canastas · solo anotadas</span>`)}</div>
    <div>${hbars(zc.map(z => ({ label: ZN[z.z], v: z.n, color: z.z === 'tri' ? '#eb6834' : cA, sub: z.pts + ' pts' })), { max: Math.max(1, ...zc.map(z => z.n)), fmt: v => nf(v, 0) })}
    <div class="mini" style="margin:14px 0 0"><div><span>Por partido</span><b>${nf(fs.length / n, 1)}</b></div><div><span>Puntos de campo</span><b>${sum(zc, z => z.pts)}</b></div><div><span>% desde la pintura</span><b>${fs.length ? nf(zc[0].n / fs.length * 100, 0) : '—'}<small>%</small></b></div></div></div></div>`;

  return kp + `<div class="grid" style="margin-top:12px">
    ${card('s12', 'Partidos', games, '', 'más reciente a la derecha')}
    ${card('s12', 'Plantilla', table, seg('tmode', MODES, tm))}
    ${card('s6', 'Reparto de minutos', share, seg('share', shOpts, S.share))}
    ${card('s6', 'Por cuartos', quarters)}
    ${card('s12', 'Quintetos', lineups, seg('luMin', [['all', 'Todos'], ['me', 'Con ' + esc(((M.names[CFG.me] || {}).name || 'Jana').split(' ')[0])]], S.luMin) + seg('luSort', [['sec', 'Minutos'], ['pm', '+/−'], ['p40', "+/− 40'"]], S.luSort))}
    ${card('s12', 'Carta de tiro', shots, shotCtl)}
  </div>`;
}

/* ---------- PARTIDOS ---------- */
function viewPartidos() {
  const all = M.games; if (!all.length) return emptyState('Sin partidos.');
  if (S.game == null || !all.find(g => g.n == S.game)) S.game = all[all.length - 1].n;
  const G = all.find(g => g.n == S.game);
  const strip = `<div class="games" style="margin:4px 0 12px">${all.map(g => `<button class="game ${g.n == G.n ? 'on' : ''}" data-act="game" data-n="${g.n}">
    <div class="gt"><span>J${g.j} · ${fdate(g.date)}</span><span>${g.home ? 'Casa' : 'Fuera'}</span></div>
    <div class="go">${esc(g.opp)}</div>
    <div class="gs"><span class="wl ${g.res}">${g.res === 'W' ? 'V' : g.res === 'L' ? 'D' : 'E'}</span><b>${g.pf}–${g.pa}</b><span class="dif">${sgn(g.diff)}</span></div></button>`).join('')}</div>`;
  const usN = M.name, us = G.home ? usN : G.opp, them = G.home ? G.opp : usN;
  const sL = G.home ? G.pf : G.pa, sR = G.home ? G.pa : G.pf;
  let board = `<div class="board"><div class="tm"><small>LOCAL</small>${esc(us)}</div><div class="sc">${sL}<i>–</i>${sR}</div><div class="tm r"><small>VISITANTE</small>${esc(them)}</div></div>`;
  if (G.periods) {
    board += `<div class="tw"><table class="qtab"><thead><tr><th></th>${G.periods.map(q => `<th>${pLabel(q.p)}</th>`).join('')}<th>Total</th></tr></thead><tbody>
      <tr><td>Claret</td>${G.periods.map(q => `<td style="${q.us > q.them ? 'font-weight:700' : ''}">${q.us}</td>`).join('')}<td style="font-weight:700">${G.pf}</td></tr>
      <tr><td>${esc(G.code)}</td>${G.periods.map(q => `<td style="${q.them > q.us ? 'font-weight:700' : ''}">${q.them}</td>`).join('')}<td style="font-weight:700">${G.pa}</td></tr></tbody></table></div>`;
    const f = G.facts;
    board += `<div class="facts"><div><span>Máxima ventaja</span><b>${sgn(f.maxL)}</b></div><div><span>Máxima desventaja</span><b>${f.maxT ? '−' + f.maxT : '0'}</b></div>
      <div><span>Mejor parcial</span><b>${f.runUs}–0</b></div><div><span>Peor parcial</span><b>0–${f.runThem}</b></div>
      <div><span>Tiempo por delante</span><b>${mmss(f.lead)}</b></div><div><span>Cambios de líder</span><b>${f.chg}</b></div></div>`;
  }
  if (!G.detail) return strip + `<div class="grid"><section class="card s12">${board}</section>${card('s12', 'Detalle', '<div class="empty">Sincroniza para cargar el detalle de este partido.</div>')}</div>`;

  // box
  const sideBox = S.box === 'us' ? G.box.us : G.box.them;
  const pls = sideBox.players.filter(p => (p.computed || {}).seconds > 0).sort((a, b) => b.starting - a.starting || (b.computed.seconds - a.computed.seconds));
  const ptsMax = Math.max(1, ...pls.map(p => p.accumulated.pts));
  const box = `<div class="tw"><table><thead><tr><th>Jugadora</th><th>Min</th><th>Pts</th><th>2P</th><th>3P</th><th>TL</th><th>F</th><th>+/−</th></tr></thead><tbody>
    ${pls.map(pl => { const a = pl.accumulated, c = pl.computed, me = pl.uuid === CFG.me;
      return `<tr class="${me ? 'me' : ''}"><td class="${S.box === 'us' ? 'nm' : ''}" ${S.box === 'us' ? `data-act="toPlayer" data-id="${pl.uuid}"` : ''}><span class="dor">${pl.dorsal}</span>${esc(title(pl.name))}${pl.starting ? '<span class="st" title="Titular"></span>' : ''}</td>
      <td>${c.min || mmss(c.seconds)}</td><td class="cellbar" style="--w:${a.pts / ptsMax * 70}%"><span style="font-weight:600">${a.pts}</span></td><td>${a.t2m}</td><td>${a.t3m}</td><td>${a.ftm}<span class="sub">/${a.fta}</span></td><td style="${a.fc >= 5 ? 'color:var(--red);font-weight:600' : ''}">${a.fc}</td><td>${pmHtml(c.onCourtPlusMinus)}</td></tr>`; }).join('')}
    <tr class="tot"><td>Total</td><td></td><td>${sideBox.accumulated.pts}</td><td>${sideBox.accumulated.t2m}</td><td>${sideBox.accumulated.t3m}</td><td>${sideBox.accumulated.ftm}/${sideBox.accumulated.fta}</td><td>${sideBox.accumulated.fc}</td><td></td></tr></tbody></table></div>
    <div class="lg"><span><span class="st" style="margin:0"></span>Titular</span></div>`;

  // rotation rows
  const rows = G.box.us.players.filter(p => (p.computed || {}).seconds > 0).map(pl => {
    const st = G.stints[pl.uuid] || [], nm = (M.names[pl.uuid] || {}).name || title(pl.name);
    return { label: nm.split(' ')[0] + (G.box.us.players.filter(q => title(q.name).split(' ')[0] === nm.split(' ')[0]).length > 1 ? ' ' + (nm.split(' ')[1] || '')[0] + '.' : ''), full: nm, stints: st, me: pl.uuid === CFG.me, s0: st.length ? st[0].s : 1e9, start: pl.starting, fouls: G.fouls.filter(f => f.id === pl.uuid) };
  }).sort((a, b) => (b.start - a.start) || a.s0 - b.s0);

  // shots of game
  const shs = (S.mshot === 'us' ? G.shotsUs : G.shotsThem).map(s => ({ ...s, tip: `<b>${s.type === 'T3' ? 'Triple' : 'Canasta de 2'}</b>${s.id ? '<br>' + esc((M.names[s.id] || {}).name || '') : s.dorsal ? `<br><span class="tm">#${s.dorsal}</span>` : ''}<br><span class="tm">${pLabel(s.per)}</span>` }));
  const cA = S.mshot === 'us' ? 'var(--blue)' : 'var(--red)';
  // scorers
  const top = G.box.us.players.slice().sort((a, b) => b.accumulated.pts - a.accumulated.pts).slice(0, 5);
  const bestPm = G.box.us.players.filter(p => p.computed.seconds > 300).sort((a, b) => b.computed.onCourtPlusMinus - a.computed.onCourtPlusMinus)[0];
  const sn = pl => { const w = title(pl.name).split(' '); return w[0] + ' ' + (w[1] || '')[0] + '.'; };
  const lead = `<div class="mini">${top.slice(0, 3).map((p, i) => `<div><span>${i === 0 ? 'Máxima anotadora' : (i + 1) + 'ª anotadora'}</span><b>${p.accumulated.pts}<small>${esc(sn(p))}</small></b></div>`).join('')}${bestPm ? `<div><span>Mejor +/−</span><b>${sgn(bestPm.computed.onCourtPlusMinus)}<small>${esc(sn(bestPm))}</small></b></div>` : ''}</div>`;

  return strip + `<div class="grid">
    <section class="card s12 fade">${board}</section>
    ${card('s12', 'Evolución del marcador', chart((el, W) => flowChart(el, W, G)), '', 'diferencia Claret − ' + esc(G.code))}
    ${card('s12', 'Estadísticas', lead + box, seg('box', [['us', 'Claret'], ['them', esc(G.code)]], S.box))}
    ${card('s12', 'Rotaciones', chart((el, W) => gantt(el, W, G, rows, W < 520 ? 70 : 110)), '', 'color = +/− del tramo · ① faltas')}
    ${card('s12', 'Carta de tiro', `<div class="split"><div>${court(shs, s => s.type === 'T3' ? '#eb6834' : cA, `<span><i class="c" style="background:${cA}"></i>2P</span><span><i class="c" style="background:#eb6834"></i>3P</span><span class="muted">solo anotadas</span>`)}</div><div>${hbars(['pin', 'med', 'tri'].map(z => ({ label: ZN[z], v: shs.filter(s => s.zone === z).length, color: z === 'tri' ? '#eb6834' : cA })), { max: Math.max(1, ...['pin', 'med', 'tri'].map(z => shs.filter(s => s.zone === z).length)), fmt: v => nf(v, 0) })}</div></div>`, seg('mshot', [['us', 'Claret'], ['them', esc(G.code)]], S.mshot))}
  </div>`;
}

/* ---------- SIMULAR ---------- */
const SIMF = [['n', 'Partidos', 1, 10], ['min', 'Minutos', 0, 45], ['t2m', 'Canastas de 2', 0, 30], ['t3m', 'Triples', 0, 15], ['ftm', 'TL anotados', 0, 30], ['fta', 'TL intentados', 0, 40], ['fc', 'Faltas', 0, 5], ['pm', '+/−', -60, 60]];
function viewSimular() {
  const gs = activeGames(); if (!gs.length) return emptyState('No hay partidos seleccionados.');
  const A = agg(gs);
  if (!A.P[S.player]) S.player = A.P[CFG.me] ? CFG.me : Object.keys(A.P)[0];
  const p = A.P[S.player];
  if (!S.sim || S.sim.id !== p.id) {
    const g = p.gp - p.partial || 1;
    S.sim = { id: p.id, n: 1, min: Math.round(p.sec / 60 / p.gp), t2m: Math.round(p.t2m / g), t3m: Math.round(p.t3m / g), ftm: Math.round(p.ftm / g), fta: Math.round(p.fta / g), fc: Math.round(p.fc / g), pm: 0 };
  }
  const sm = S.sim; sm.fta = Math.max(sm.fta, sm.ftm);
  // simulated player
  const q = { ...p, per: p.per, games: p.games };
  q.gp = p.gp + sm.n; q.sec = p.sec + sm.n * sm.min * 60;
  ['t2m', 't3m', 'ftm', 'fta', 'fc', 'pm'].forEach(k => q[k] = p[k] + sm.n * sm[k]);
  q.pts = p.pts + sm.n * (sm.t2m * 2 + sm.t3m * 3 + sm.ftm);
  const B = { P: { ...A.P, [p.id]: q } };
  const simPts = sm.t2m * 2 + sm.t3m * 3 + sm.ftm;

  const inputs = `<div class="simgrid">${SIMF.map(([k, l, mn, mx]) => `<div class="inp"><label>${l}${k === 'n' ? '' : ' / partido'}</label><div class="stp"><button data-act="sim" data-k="${k}" data-d="-1" aria-label="menos">−</button><input type="number" inputmode="numeric" data-act="simIn" data-k="${k}" min="${mn}" max="${mx}" value="${sm[k]}"><button data-act="sim" data-k="${k}" data-d="1" aria-label="más">+</button></div></div>`).join('')}</div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px"><span class="muted" style="font-size:12px">Atajos</span><div class="presets">
      <button class="pbtn" data-act="preset" data-v="avg">Mi media</button><button class="pbtn" data-act="preset" data-v="best">Mi mejor partido</button><button class="pbtn" data-act="preset" data-v="up">Media +20%</button><button class="pbtn" data-act="preset" data-v="zero">No juego</button></div>
      <div class="sp" style="flex:1"></div><span style="font-size:13px">= <b>${simPts}</b> pts por partido simulado</span></div>`;

  const rowsDef = [['min', 'Minutos / partido', 'pg', 1], ['pts', 'Puntos / partido', 'pg', 1], ['pts', "Puntos / 40'", 'p40', 1], ['t2m', 'Canastas de 2 / partido', 'pg', 1], ['t3m', 'Triples / partido', 'pg', 1], ['ftp', 'TL %', 'pg', 0], ['fc', 'Faltas / partido', 'pg', 1], ['fc', "Faltas / 40'", 'p40', 1], ['pm', '+/− total', 'tot', 0], ['pm', "+/− / 40'", 'p40', 1], ['pts', 'Puntos totales', 'tot', 0]];
  const val = (pp, k, m) => k === 'min' ? pp.sec / 60 / pp.gp : mv(pp, k, m);
  const res = `<div class="tw"><table><thead><tr><th>Estadística</th><th>Ahora</th><th>Simulado</th><th>Cambio</th><th>Ranking</th></tr></thead><tbody>
    ${rowsDef.map(([k, l, m, d]) => {
      const a = val(p, k, m), b = val(q, k, m), df = ok(a) && ok(b) ? b - a : null, low = MET[k] && MET[k].low;
      const ra = rank(A, p.id, k, k === 'min' ? 'pg' : m, low), rb = rank(B, p.id, k, k === 'min' ? 'pg' : m, low);
      const dir = !ok(df) || Math.abs(df) < .05 ? '' : ((df > 0) !== !!low ? 'up' : 'dn');
      const f = v => k === 'ftp' ? (ok(v) ? nf(v, 0) + '%' : '—') : k === 'pm' ? sgn(v, d) : nf(v, d);
      return `<tr><td>${l}</td><td>${f(a)}</td><td style="font-weight:700">${f(b)}</td><td class="delta ${dir}">${ok(df) ? (Math.abs(df) < .05 ? '=' : (df > 0 ? '+' : '−') + nf(Math.abs(df), k === 'ftp' ? 1 : d)) : '—'}</td>
        <td>${ra ? ra.r + 'º' : '—'}${rb && ra && rb.r !== ra.r ? ` → <b>${rb.r}º</b>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div>`;

  const chartSim = chart((el, W) => {
    const items = gs.filter(g => g.players[p.id] && g.players[p.id].sec > 0 && !g.players[p.id].partial).map(g => ({ v: g.players[p.id].pts, label: 'J' + g.j, sub: (g.home ? '' : '@') + g.code, tip: `<b>J${g.j} · ${esc(g.opp)}</b><br>${g.players[p.id].pts} pts` }));
    for (let i = 0; i < Math.min(sm.n, 6); i++) items.push({ v: simPts, label: 'S' + (i + 1), sub: 'simulado', ghost: true, tip: `<b>Partido simulado</b><br>${simPts} pts · ${sm.min} min` });
    vbars(el, W, { items, avg: q.pts / q.gp, H: 200 });
  });

  const head = `<div class="phead"><div class="psel"><select data-act="player">${playerOptions(A, p.id)}</select></div><div class="pmeta"><span>Base: <b>${p.gp}</b>partidos seleccionados</span></div></div>`;
  return head + `<div class="grid">
    ${card('s12', 'Próximos partidos', inputs, '', 'qué números harías')}
    ${card('s7', 'Cómo cambiarían tus números', res)}
    ${card('s5', 'Puntos por partido', chartSim, '', 'reales + simulados')}
  </div>`;
}

/* ================= render ================= */
const TABS = [['jugadora', 'Jugadora'], ['equipo', 'Equipo'], ['partidos', 'Partidos'], ['simular', 'Simular']];
function renderFilters() {
  if (!M || S.view === 'partidos') { $('#filters').innerHTML = '<div style="height:12px"></div>'; return; }
  const sel = new Set(S.sel || M.games.map(g => g.n));
  const chips = M.games.map(g => {
    const locOk = S.loc === 'all' || (S.loc === 'home') === g.home;
    return `<button class="gchip ${sel.has(g.n) ? 'on' : ''} ${locOk ? '' : 'dis'}" data-act="tg" data-n="${g.n}" data-tip="${esc(`${g.opp} · ${g.pf}–${g.pa}`)}"><span class="cb"></span>J${g.j} ${g.home ? '' : '@'}${esc(g.code)}<span class="r ${g.res}">${g.res === 'W' ? 'V' : g.res === 'L' ? 'D' : 'E'}</span></button>`;
  }).join('');
  const allOn = sel.size === M.games.length;
  $('#filters').innerHTML = `<div class="filters"><div class="fgroup"><span class="fl">Partidos</span>${chips}${allOn ? '' : `<button class="linkbtn" data-act="selAll">Todos</button>`}</div>
    <div class="fgroup">${seg('loc', [['all', 'Todos'], ['home', 'Casa'], ['away', 'Fuera']], S.loc)}</div></div>`;
}
function render() {
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab ${S.view === k ? 'on' : ''}" data-act="view" data-v="${k}">${l}</button>`).join('');
  CHARTS = [];
  if (!M) { $('#filters').innerHTML = ''; $('#app').innerHTML = emptyState(RAW === false ? 'No se han podido cargar los datos.' : 'Cargando…'); return; }
  renderFilters();
  const v = { jugadora: viewJugadora, equipo: viewEquipo, partidos: viewPartidos, simular: viewSimular }[S.view] || viewJugadora;
  $('#app').innerHTML = v();
  mountCharts();
}
function header() {
  $('#tname').textContent = M.name; $('#tsub').textContent = M.sub;
  const w = M.games.filter(g => g.res === 'W').length, l = M.games.filter(g => g.res === 'L').length;
  const sy = M.meta && M.meta.syncedAt ? new Date(M.meta.syncedAt) : null;
  $('#rec').innerHTML = `<span class="lbl">${sy ? 'Act. ' + sy.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) : ''}</span><div class="form">${M.games.slice(-5).map(g => `<i class="${g.res}" data-tip="${esc(`J${g.j} · ${g.opp} · ${g.pf}–${g.pa}`)}"></i>`).join('')}</div><b>${w}–${l}</b>`;
}

/* ================= events ================= */
function go(push) { const h = '#' + S.view + (S.view === 'partidos' && S.game != null ? '/' + S.game : ''); if (location.hash !== h) history.replaceState(null, '', h); render(); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.tagName === 'SELECT' || t.tagName === 'INPUT') return;
  const a = t.dataset.act;
  if (a === 'view') { S.view = t.dataset.v; go(); }
  else if (a === 'set') { S[t.dataset.k] = t.dataset.v; ['mode', 'tmode', 'loc'].includes(t.dataset.k) && store.set(t.dataset.k, t.dataset.v); render(); }
  else if (a === 'sort') { const k = t.dataset.k; S.sort = { k, d: S.sort.k === k ? -S.sort.d : (k === 'name' ? 1 : -1) }; render(); }
  else if (a === 'toPlayer') { S.player = t.dataset.id; store.set('player', S.player); S.view = 'jugadora'; go(); scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (a === 'game') { S.game = +t.dataset.n; S.view = 'partidos'; go(); scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (a === 'tg') {
    const sel = new Set(S.sel || M.games.map(g => g.n)), n = +t.dataset.n;
    if (sel.has(n)) { if (sel.size > 1) sel.delete(n); } else sel.add(n);
    S.sel = sel.size === M.games.length ? null : [...sel]; store.set('sel', S.sel); render();
  }
  else if (a === 'selAll') { S.sel = null; store.set('sel', null); render(); }
  else if (a === 'sim') { const f = SIMF.find(x => x[0] === t.dataset.k); S.sim[f[0]] = clamp((+S.sim[f[0]] || 0) + +t.dataset.d, f[2], f[3]); if (f[0] === 'ftm') S.sim.fta = Math.max(S.sim.fta, S.sim.ftm); if (f[0] === 'fta') S.sim.ftm = Math.min(S.sim.ftm, S.sim.fta); render(); }
  else if (a === 'preset') {
    const A = agg(activeGames()), p = A.P[S.player]; if (!p) return;
    const mine = activeGames().filter(g => g.players[p.id] && g.players[p.id].sec > 0 && !g.players[p.id].partial).map(g => g.players[p.id]);
    const g = mine.length || 1, base = { min: p.sec / 60 / p.gp, t2m: p.t2m / g, t3m: p.t3m / g, ftm: p.ftm / g, fta: p.fta / g, fc: p.fc / g, pm: p.pm / g };
    const v = t.dataset.v; let o = base;
    if (v === 'best' && mine.length) { const b = mine.reduce((x, y) => y.pts > x.pts ? y : x); o = { min: b.sec / 60, t2m: b.t2m, t3m: b.t3m, ftm: b.ftm, fta: b.fta, fc: b.fc, pm: b.pm }; }
    if (v === 'up') o = Object.fromEntries(Object.entries(base).map(([k, x]) => [k, k === 'fc' ? x : k === 'pm' ? x + 3 : x * 1.2]));
    if (v === 'zero') o = { min: 0, t2m: 0, t3m: 0, ftm: 0, fta: 0, fc: 0, pm: 0 };
    Object.entries(o).forEach(([k, x]) => S.sim[k] = Math.round(x)); S.sim.fta = Math.max(S.sim.fta, S.sim.ftm);
    render();
  }
});
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset.act;
  if (a === 'player') { S.player = t.value; store.set('player', S.player); render(); }
  else if (a === 'sel') { S[t.dataset.k] = t.value; render(); }
  else if (a === 'simIn') { const f = SIMF.find(x => x[0] === t.dataset.k); S.sim[f[0]] = clamp(Math.round(+t.value || 0), f[2], f[3]); if (f[0] === 'ftm') S.sim.fta = Math.max(S.sim.fta, S.sim.ftm); if (f[0] === 'fta') S.sim.ftm = Math.min(S.sim.ftm, S.sim.fta); render(); }
});
function readHash() { const [v, n] = location.hash.slice(1).split('/'); if (TABS.some(t => t[0] === v)) S.view = v; if (n) S.game = +n; }
addEventListener('hashchange', () => { readHash(); render(); });

readHash(); render();
load().then(() => {
  if (S.sel) { const ok_ = S.sel.filter(n => M.games.some(g => g.n === n)); S.sel = ok_.length ? ok_ : null; }
  header(); render();
}).catch(err => { console.error(err); RAW = false; render(); });
</script>
</body>
</html>
