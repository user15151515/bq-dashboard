<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claret Stats</title>
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0b'/%3E%3Cpath d='M8 22V10h5a4 4 0 0 1 0 8H8' stroke='%23fff' stroke-width='2.4' fill='none'/%3E%3Ccircle cx='23' cy='21' r='2.5' fill='%23eb6834'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#f6f6f4;--surface:#fcfcfb;--surface2:#f1f1ee;--surface3:#e9e8e4;
  --border:#e4e3de;--border2:#d3d2cc;--grid:#ecebe7;
  --text:#0b0b0b;--text2:#52514e;--text3:#8a8984;
  --blue:#2a78d6;--blue-soft:#cde2fb;--red:#e34948;--red-soft:#f8d2d1;--me:#eb6834;--mid:#c9c8c2;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    color-scheme:dark;
    --bg:#121211;--surface:#1a1a19;--surface2:#222220;--surface3:#2a2a28;
    --border:#2c2c2a;--border2:#3a3a37;--grid:#262624;
    --text:#f0efec;--text2:#c3c2b7;--text3:#8b8a84;
    --blue:#3987e5;--blue-soft:#1c3556;--red:#e66767;--red-soft:#4a2526;--me:#d95926;--mid:#4a4a46;
  }
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--surface2:#222220;--surface3:#2a2a28;
  --border:#2c2c2a;--border2:#3a3a37;--grid:#262624;
  --text:#f0efec;--text2:#c3c2b7;--text3:#8b8a84;
  --blue:#3987e5;--blue-soft:#1c3556;--red:#e66767;--red-soft:#4a2526;--me:#d95926;--mid:#4a4a46;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:400 14px/1.45 var(--font);font-feature-settings:'tnum' 1,'cv11' 1;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
.mark{width:32px;height:32px;border-radius:8px;background:#0b0b0b;box-shadow:inset 0 0 0 1px var(--border2);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
.ttl{min-width:0}
.ttl b{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em}
.ttl span{display:block;font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.rec{white-space:nowrap;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2)}
.rec b{font-size:15px;color:var(--text);font-weight:700}
.form{display:flex;gap:3px}
.form i{width:8px;height:8px;border-radius:2px;background:var(--mid)}
.form i.W{background:var(--blue)}.form i.L{background:var(--red)}

/* nav */
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:30;background:var(--bg)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;height:42px;padding:0 14px;font-weight:600;font-size:13px;color:var(--text3);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text)}
.tab.on:after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--text);border-radius:2px}

/* filter bar */
.filters{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:12px 0}
.fl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 8px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);font-size:12px;font-weight:600;color:var(--text2)}
.gchip .cb{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border2);display:grid;place-items:center}
.gchip.on{color:var(--text);border-color:var(--text2)}
.gchip.on .cb{background:var(--text);border-color:var(--text)}
.gchip.on .cb:after{content:'';width:7px;height:4px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.gchip.dis{opacity:.4;pointer-events:none}
.gchip .r{font-size:10px;font-weight:700;padding:1px 4px;border-radius:3px;color:#fff}
.gchip .r.W{background:var(--blue)}.gchip .r.L{background:var(--red)}
.linkbtn{font-size:12px;font-weight:600;color:var(--text3);text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--text)}

.seg{display:inline-flex;border:1px solid var(--border2);border-radius:7px;padding:2px;background:var(--surface);flex:none}
.seg button{height:24px;padding:0 10px;border-radius:5px;font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap}
.seg button.on{background:var(--text);color:var(--surface)}
.seg button:not(.on):hover{color:var(--text)}

/* layout */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;padding-bottom:48px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
@media (max-width:920px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;min-width:0}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;min-height:28px}
.ch h3{font-size:13px;font-weight:600;letter-spacing:-.005em}
.ch .sub{font-size:12px;color:var(--text3)}
.ch .sp{flex:1}
.chart{width:100%}
.chart svg{display:block;overflow:visible}
.muted{color:var(--text3)}
.empty{padding:28px 8px;text-align:center;color:var(--text3);font-size:13px}

/* svg */
.ax{fill:var(--text3);font:500 10.5px var(--font)}
.axs{fill:var(--text2);font:600 11px var(--font)}
.gl{stroke:var(--grid);stroke-width:1}
.gl0{stroke:var(--border2);stroke-width:1}
.vl{fill:var(--text);font:600 11.5px var(--font)}
.vlw{fill:#fff;font:600 10.5px var(--font);pointer-events:none}
.rl{fill:var(--text2);font:500 12px var(--font)}
.rl.me{fill:var(--text);font-weight:700}
.trk{fill:var(--surface2)}

/* player head */
.phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:4px 0 14px}
.psel{position:relative}
.psel select{appearance:none;height:40px;padding:0 38px 0 12px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);font-size:16px;font-weight:700;letter-spacing:-.01em;cursor:pointer;max-width:80vw}
.psel:after{content:'';position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--text2);border-bottom:2px solid var(--text2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.pmeta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text3)}
.pmeta b{color:var(--text);font-weight:600;font-size:13px;margin-right:3px}
.phead .sp{flex:1}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:12px 14px 12px;min-width:0}
.kpi .l{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.02em}
.kpi .rk{font-size:11px;font-weight:600;color:var(--text2)}
.kpi .rk.top{color:var(--text);}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.025em;margin-top:4px;line-height:1.1;white-space:nowrap}
.kpi .v small{font-size:13px;font-weight:500;color:var(--text3);letter-spacing:0;margin-left:4px}
.kpi .f{margin-top:6px;font-size:11.5px;color:var(--text3);display:flex;align-items:center;gap:4px;white-space:nowrap;min-height:16px}
.kpi .f b{color:var(--text2);font-weight:600}
.arr{display:inline-block;font-size:10px;width:14px;height:14px;line-height:14px;text-align:center;border-radius:3px;background:var(--surface2);color:var(--text2)}
.arr.up{background:var(--blue-soft);color:var(--blue)}.arr.dn{background:var(--red-soft);color:var(--red)}

/* tables */
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:600;color:var(--text3);text-align:right;padding:8px 8px;border-bottom:1px solid var(--border2);white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover,th.on{color:var(--text)}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;font-size:13px}
tbody tr:last-child td{border-bottom:0}
tr.me td{background:color-mix(in srgb,var(--me) 7%,transparent)}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--me)}
tr.me td.nm{padding-left:10px}
tr.tot td{border-top:1px solid var(--border2);font-weight:600;color:var(--text2)}
td.nm{font-weight:500;cursor:pointer}
td.nm:hover{text-decoration:underline;text-underline-offset:3px}
.dor{display:inline-block;min-width:22px;font-size:11px;font-weight:600;color:var(--text3)}
.st{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--text);margin-left:6px;vertical-align:middle}
.pmv{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.pmv i{width:6px;height:6px;border-radius:50%;background:var(--mid)}
.pmv i.p{background:var(--blue)}.pmv i.n{background:var(--red)}
td .sub{color:var(--text3)}
.cellbar{position:relative}
.cellbar:before{content:'';position:absolute;right:0;top:4px;bottom:4px;width:var(--w);background:var(--blue-soft);border-radius:3px;opacity:.75}
.cellbar span{position:relative}

/* lists / bars */
.hb{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) max-content;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.hb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);font-weight:500}
.hb .n.me{color:var(--text);font-weight:700}
.hb .t{position:relative;height:16px}
.hb .t i{position:absolute;top:0;bottom:0;border-radius:3px}
.hb .t .z{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--border2)}
.hb .v{text-align:right;font-weight:600;white-space:nowrap;min-width:48px}
.hb .v small{font-weight:500;color:var(--text3);margin-left:4px}

/* games strip */
.games{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.game{text-align:left;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface);transition:border-color .12s}
.game:hover{border-color:var(--border2)}
.game.on{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.game.off{opacity:.45}
.game .gt{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);font-weight:500}
.game .go{font-weight:600;font-size:13px;margin:4px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game .gs{display:flex;align-items:center;gap:8px}
.game .gs b{font-size:18px;font-weight:700;letter-spacing:-.02em}
.wl{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font-size:10px;font-weight:700;color:#fff;background:var(--mid)}
.wl.W{background:var(--blue)}.wl.L{background:var(--red)}
.dif{font-size:12px;font-weight:600;color:var(--text2)}

/* heat */
.heat{display:grid;gap:4px;font-variant-numeric:tabular-nums}
.heat .hr{display:grid;gap:4px}
.heat .hd{font-size:11px;font-weight:600;color:var(--text3);text-align:center;padding-bottom:2px}
.heat .lab{display:flex;flex-direction:column;justify-content:center;font-size:12px;font-weight:600}
.heat .lab small{font-size:11px;font-weight:500;color:var(--text3)}
.cell{border-radius:5px;min-height:44px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:13px;font-weight:600}
.cell small{font-size:10.5px;font-weight:500;opacity:.85;margin-top:1px}
.cell.na{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--surface2) 5px 6px);border:1px dashed var(--border)}
.cell.zero{background:var(--surface2);color:var(--text3)}
.heat .hr.avg .cell{min-height:34px}

/* legend */
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin-top:10px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.lg i.c{border-radius:50%}

/* stacked share */
.stack{display:flex;gap:2px;height:28px;border-radius:5px;overflow:hidden}
.stack i{font-style:normal;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}

/* scoreboard */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.board .tm{font-weight:700;font-size:16px;letter-spacing:-.01em}
.board .tm small{display:block;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.04em;margin-bottom:2px}
.board .tm.r{text-align:right}
.board .sc{font-size:40px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.board .sc i{font-style:normal;color:var(--text3);font-weight:400;margin:0 8px}
.qtab{margin:14px auto 0;width:auto;border-collapse:collapse}
.qtab th,.qtab td{padding:5px 12px;text-align:center;font-size:12px}
.qtab td:first-child,.qtab th:first-child{text-align:left;padding-left:0;font-weight:600}
.qtab tr:last-child td{border-bottom:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:16px}
.facts div{background:var(--surface);padding:10px 12px}
.facts span{display:block;font-size:11px;color:var(--text3);font-weight:500}
.facts b{font-size:16px;font-weight:700}
.facts b small{font-size:11px;font-weight:500;color:var(--text3);margin-left:4px}

/* lineup chips */
.lu{display:flex;gap:3px}
.lu span{min-width:22px;height:22px;padding:0 4px;border-radius:4px;display:grid;place-items:center;background:var(--surface2);font-size:11px;font-weight:600;color:var(--text2)}
.lu span.me{background:var(--me);color:#fff}

/* sim */
.simgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.simgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.inp{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface)}
.inp label{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-bottom:6px}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:30px;height:30px;border-radius:6px;border:1px solid var(--border2);font-size:16px;font-weight:600;color:var(--text2);flex:none}
.stp button:hover{color:var(--text);border-color:var(--text3)}
.stp input{width:100%;min-width:0;height:30px;border:0;background:transparent;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp input:focus{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.delta{font-weight:600}
.delta.up{color:var(--blue)}.delta.dn{color:var(--red)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--border2);font-size:12px;font-weight:600;color:var(--text2);background:var(--surface)}
.pbtn:hover{color:var(--text);border-color:var(--text3)}

/* stats mini */
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px}
.mini div{background:var(--surface);padding:9px 12px}
.mini span{display:block;font-size:11px;color:var(--text3);font-weight:500}
.mini b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.mini b small{font-size:11px;color:var(--text3);font-weight:500;margin-left:3px}

.court{width:100%;max-width:440px;display:block;margin:0 auto}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrls select{height:28px;border:1px solid var(--border2);border-radius:7px;background:var(--surface);padding:0 8px;font-size:12px;font-weight:600;color:var(--text2)}

#tip{position:fixed;z-index:100;pointer-events:none;background:var(--text);color:var(--surface);padding:7px 10px;border-radius:7px;font-size:12px;line-height:1.4;max-width:260px;opacity:0;transition:opacity .1s;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#tip.show{opacity:1}
#tip b{font-weight:600}
#tip .tm{opacity:.7}
.fade{animation:fd .25s ease both}
@keyframes fd{from{opacity:0;transform:translateY(3px)}}
@media (max-width:600px){
  .board .sc{font-size:30px}.board .tm{font-size:13px}
  .hb{grid-template-columns:76px minmax(0,1fr) max-content}
  .rec .lbl{display:none}
  .cell small{display:none}
  .kpis .kpi:last-child:nth-child(odd){grid-column:span 2}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M5 18V6h5.5a4 4 0 0 1 0 8H5" stroke="#fff" stroke-width="2.2"/><circle cx="18" cy="17" r="2.2" fill="#eb6834"/></svg></div>
    <div class="ttl"><b id="tname">Claret Stats</b><span id="tsub">&nbsp;</span></div>
    <div class="sp"></div>
    <div class="rec" id="rec"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="filters"></div>
  <main id="app"></main>
</div>
<div id="tip"></div>

<script>
'use strict';
const CFG = { me: '4d69104c-591f-4d9a-a082-375e3c9cd842', data: './data/' };

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ok = v => v != null && isFinite(v);
const nf = (v, d = 1) => !ok(v) ? '—' : v.toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
const sgn = (v, d = 0) => !ok(v) ? '—' : (Math.round(v * 10 ** d) === 0 ? '0' : (v > 0 ? '+' : '−') + nf(Math.abs(v), d));
const mmss = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const per40 = (v, sec) => sec > 0 ? v / sec * 2400 : null;
const pct = (a, b) => b > 0 ? a / b * 100 : null;
const title = s => String(s || '').toLocaleLowerCase('es').replace(/(^|[\s\-·(.'’])(\p{L})/gu, (m, a, b) => a + b.toLocaleUpperCase('es')).replace(/\b(Cb|Bc|Ue|Ae|Ce|Cn|Cd|Ud|Ab|Cbf)\b/g, m => m.toUpperCase());
const pLabel = p => p <= 4 ? 'C' + p : (p === 5 ? 'Pró' : 'Pró' + (p - 4));
const fdate = d => { const [y, m, dd] = String(d).slice(0, 10).split('-'); return `${+dd}/${+m}`; };
const store = { get(k, d) { try { const v = localStorage.getItem('cs2.' + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem('cs2.' + k, JSON.stringify(v)); } catch (_) {} } };
const sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pmCls = v => v > 0 ? 'p' : v < 0 ? 'n' : '';
const pmCol = v => v > 0 ? 'var(--blue)' : v < 0 ? 'var(--red)' : 'var(--mid)';
const pmHtml = (v, d = 0) => `<span class="pmv"><i class="${pmCls(v)}"></i>${sgn(v, d)}</span>`;
function shortCode(name) {
  const w = String(name).replace(/[^\p{L}\s']/gu, ' ').split(/\s+/).filter(x => x.length > 1 && !/^(DE|DEL|LA|EL|LES|ELS|CB|BC|UE|AE|SE|CE|A|B)$/i.test(x));
  return w.length >= 2 ? w.slice(0, 3).map(x => x[0]).join('').toUpperCase() : (w[0] || name).slice(0, 3).toUpperCase();
}
const isFoul = c => /^(P\d?|T\d+|C\d+|AT|U\d*|AD)$/.test(c) && c !== 'TM';

/* ================= data ================= */
let RAW = null, M = null;
async function getJSON(p) { const r = await fetch(CFG.data + p + '?v=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error(r.status + ' ' + p); return r.json(); }
async function load() {
  const team = await getJSON('team.json');
  let meta = null; try { meta = await getJSON('index.json'); } catch (_) {}
  const matches = {};
  await Promise.all((team.games || []).map(async g => { try { matches[g.matchCallUuid] = await getJSON('matches/' + g.matchCallUuid + '.json'); } catch (_) {} }));
  RAW = { team, matches, meta };
  M = buildModel(RAW);
}

function buildModel({ team, matches, meta }) {
  const TU = team.header.team.uuid;
  const names = {};
  (team.roster || []).forEach(r => names[r.uuid] = { name: title(r.name), dorsal: r.dorsal });
  const byDorsal = {}; (team.roster || []).forEach(r => byDorsal[r.dorsal] = r.uuid);

  const games = (team.games || []).slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || a.gameNumber - b.gameNumber).map((g, idx) => {
    const G = { idx, n: g.gameNumber, j: g.matchDayNum, uuid: g.matchCallUuid, date: g.date, home: !!g.home,
      opp: title(g.opponent.name), code: shortCode(g.opponent.name), pf: g.pointsFor, pa: g.pointsAgainst, diff: g.differential ?? (g.pointsFor - g.pointsAgainst),
      res: g.result, acc: g.accumulated || {}, oacc: (g.opponentStats || {}).accumulated || {}, players: {}, detail: false, len: 2400 };
    const m = matches[g.matchCallUuid];
    const sh = team.shots || {};
    const gm = matches[g.matchCallUuid], gDor = {};
    try { const hh = gm.stats.header, sd = hh.localTeam.uuid === TU ? 'local' : 'visitor'; gm.stats.boxscore.find(b => b.period === 0)[sd].players.forEach(pl => gDor[pl.dorsal] = pl.uuid); } catch (_) {}
    G.shotsUs = (sh.offense || []).filter(s => s.gameNumber === g.gameNumber).map(s => mkShot(s, gDor[s.dorsal] || byDorsal[s.dorsal]));
    G.shotsThem = (sh.defense || []).filter(s => s.gameNumber === g.gameNumber).map(s => mkShot(s, null));
    if (!(m && m.stats && m.stats.boxscore)) {
      (team.roster || []).forEach(r => { const s = (r.minutesByGame || {})[g.gameNumber]; if (s) G.players[r.uuid] = { sec: s, partial: true }; });
      return G;
    }
    G.detail = true;
    const S = m.stats, h = S.header;
    const side = h.localTeam.uuid === TU ? 'local' : 'visitor', op = side === 'local' ? 'visitor' : 'local';
    G.code = h[op + 'Team'].shortName || G.code;
    const per = S.boxscore.filter(b => b.period > 0).sort((a, b) => a.period - b.period);
    let t = 0;
    G.periods = per.map(b => { const len = (b[side].computed || {}).seconds || (b.period <= 4 ? 600 : 300); const x = { p: b.period, len, start: t, us: b[side].accumulated.pts, them: b[op].accumulated.pts }; t += len; return x; });
    G.len = t;
    const b0 = S.boxscore.find(b => b.period === 0);
    G.box = { us: b0[side], them: b0[op] };
    b0[side].players.forEach(pl => {
      const a = pl.accumulated || {}, c = pl.computed || {};
      if (!names[pl.uuid]) names[pl.uuid] = { name: title(pl.name), dorsal: pl.dorsal };
      G.players[pl.uuid] = { sec: c.seconds || 0, pts: a.pts || 0, t2m: a.t2m || 0, t3m: a.t3m || 0, ftm: a.ftm || 0, fta: a.fta || 0, fc: a.fc || 0, pm: c.onCourtPlusMinus || 0, start: !!pl.starting, per: {} };
    });
    per.forEach(b => b[side].players.forEach(pl => {
      const x = G.players[pl.uuid]; if (!x) return;
      x.per[b.period] = { sec: (pl.computed || {}).seconds || 0, pts: (pl.accumulated || {}).pts || 0, pm: (pl.computed || {}).onCourtPlusMinus || 0, fc: (pl.accumulated || {}).fc || 0 };
    }));
    G.stints = {};
    ((S.stints || {})[side] || []).forEach(s => G.stints[s.uuid] = (s.stints || []).map(x => ({ s: x.startSeconds, e: x.endSeconds, pm: (x.computed || {}).onCourtPlusMinus || 0, sp: x.startPeriod, ep: x.endPeriod })));
    G.lineups = ((S.lineups || {})[side] || []).map(l => ({ ids: l.players.map(p => p.uuid).sort(), sec: l.seconds || 0, pm: l.onCourtPlusMinus ?? l.plusMinus ?? 0 }));
    // timeline helpers
    const pStart = {}, pLen = {}; G.periods.forEach(x => { pStart[x.p] = x.start; pLen[x.p] = x.len; });
    const tAt = (p, mi, se) => pStart[p] == null ? null : pStart[p] + pLen[p] - ((mi || 0) * 60 + (se || 0));
    // flow
    let flow = [{ t: 0, us: 0, them: 0, k: 0 }];
    (S.scoreEvolution || []).forEach((e, i) => {
      const tt = tAt(e.period, e.minute, e.second); if (tt == null) return;
      flow.push({ t: tt, us: side === 'local' ? e.local : e.visitor, them: side === 'local' ? e.visitor : e.local, k: i + 1 });
    });
    flow.sort((a, b) => a.t - b.t || a.k - b.k);
    G.flow = flow;
    // pbp: fouls + scorers
    G.fouls = []; G.scores = [];
    ((m.pbp || {}).playByPlay || []).forEach(e => {
      const tt = tAt(e.period, e.minute, e.second); if (tt == null) return;
      if (e.teamUuid === TU && isFoul(e.eventTypeCode) && e.uuid) G.fouls.push({ id: e.uuid, t: tt, p: e.period, code: e.eventTypeCode });
      if (/^D[123]$/.test(e.eventTypeCode)) G.scores.push({ t: tt, us: e.teamUuid === TU, id: e.uuid, v: +e.eventTypeCode[1], name: title(e.actorName || '') });
    });
    // facts
    let maxL = 0, maxT = 0, cur = { w: null, n: 0 }, best = { us: 0, them: 0 }, chg = 0, last = 0, tied = 0;
    for (let i = 1; i < flow.length; i++) {
      const d = flow[i].us - flow[i].them; maxL = Math.max(maxL, d); maxT = Math.min(maxT, d);
      const du = flow[i].us - flow[i - 1].us, dt = flow[i].them - flow[i - 1].them;
      const w = du > 0 ? 'us' : dt > 0 ? 'them' : null; if (!w) continue;
      cur = cur.w === w ? { w, n: cur.n + du + dt } : { w, n: du + dt }; best[w] = Math.max(best[w], cur.n);
      const sg = Math.sign(d); if (!sg) tied++; if (sg && last && sg !== last) chg++; if (sg) last = sg;
    }
    // time leading
    let lead = 0, trail = 0;
    for (let i = 0; i < flow.length; i++) { const d = flow[i].us - flow[i].them, nt = i + 1 < flow.length ? flow[i + 1].t : G.len, dt = nt - flow[i].t; if (d > 0) lead += dt; else if (d < 0) trail += dt; }
    G.facts = { maxL, maxT: -maxT, runUs: best.us, runThem: best.them, chg, tied, lead, trail };
    return G;
  });

  function mkShot(s, id) {
    const depth = Math.abs(s.x), lat = s.x < 0 ? -s.y : s.y;
    const dist = Math.hypot(lat, depth);
    const zone = s.type === 'T3' ? 'tri' : (Math.abs(lat) <= 2450 && depth <= 4225 ? 'pin' : 'med');
    return { cx: lat, cy: depth, type: s.type, made: s.made !== false, id, dorsal: s.dorsal, g: s.gameNumber, per: s.period, dist, zone };
  }

  const hd = team.header;
  return { TU, names, games, meta, rec: hd.record || {}, season: team.season,
    name: title(hd.team.name), sub: [title(hd.categoryName || ''), (hd.competitions || []).map(c => title(c.competitionName) + ' · Grupo ' + c.groupName).join(' / ')].filter(Boolean).join(' · ') };
}

/* ================= aggregation ================= */
function agg(games) {
  const P = {};
  const T = { gp: games.length, w: 0, l: 0, pf: 0, pa: 0, sec: 0, ftm: 0, fta: 0, fc: 0, t2m: 0, t3m: 0, ofc: 0, per: {} };
  games.forEach(G => {
    T.pf += G.pf; T.pa += G.pa; T.sec += G.len; if (G.res === 'W') T.w++; else if (G.res === 'L') T.l++;
    T.ftm += G.acc.ftm || 0; T.fta += G.acc.fta || 0; T.fc += G.acc.fc || 0; T.t2m += G.acc.t2m || 0; T.t3m += G.acc.t3m || 0; T.ofc += G.oacc.fc || 0;
    (G.periods || []).forEach(q => { const x = T.per[q.p] || (T.per[q.p] = { n: 0, us: 0, them: 0 }); x.n++; x.us += q.us; x.them += q.them; });
    Object.entries(G.players).forEach(([id, x]) => {
      if (!(x.sec > 0)) return;
      const p = P[id] || (P[id] = { id, gp: 0, gs: 0, sec: 0, pts: 0, t2m: 0, t3m: 0, ftm: 0, fta: 0, fc: 0, pm: 0, offPm: 0, offSec: 0, partial: 0, per: {}, games: [] });
      p.gp++; p.games.push(G.n); if (x.start) p.gs++;
      p.sec += x.sec;
      if (x.partial) { p.partial++; return; }
      p.pts += x.pts; p.t2m += x.t2m; p.t3m += x.t3m; p.ftm += x.ftm; p.fta += x.fta; p.fc += x.fc; p.pm += x.pm;
      p.offPm += G.diff - x.pm; p.offSec += G.len - x.sec;
      Object.entries(x.per || {}).forEach(([k, q]) => { const y = p.per[k] || (p.per[k] = { sec: 0, pts: 0, pm: 0, fc: 0, n: 0 }); y.sec += q.sec; y.pts += q.pts; y.pm += q.pm; y.fc += q.fc; y.n++; });
    });
  });
  Object.values(P).forEach(p => { const n = M.names[p.id] || {}; p.name = n.name || '—'; p.dorsal = n.dorsal || ''; const w = p.name.split(' '); p.first = w[0]; p.sur = w.slice(1).join(' '); });
  const cnt = {}; Object.values(P).forEach(p => cnt[p.first] = (cnt[p.first] || 0) + 1);
  Object.values(P).forEach(p => p.nick = cnt[p.first] > 1 ? `${p.first} ${(p.sur[0] || '')}.` : p.first);
  // lineups
  const L = {};
  games.forEach(G => (G.lineups || []).forEach(l => { const k = l.ids.join('|'); const x = L[k] || (L[k] = { ids: l.ids, sec: 0, pm: 0, g: new Set() }); x.sec += l.sec; x.pm += l.pm; x.g.add(G.n); }));
  return { P, T, L: Object.values(L), games };
}

/* metric access */
const MET = {
  min: { l: 'Minutos', tot: p => p.sec / 60, d: 1, fmtT: p => mmss(p.sec) },
  pts: { l: 'Puntos', k: 'pts' },
  t2m: { l: 'Canastas de 2', k: 't2m' },
  t3m: { l: 'Triples', k: 't3m' },
  ftm: { l: 'TL anotados', k: 'ftm' },
  fta: { l: 'TL intentados', k: 'fta' },
  ftp: { l: 'TL %', pctOnly: true },
  fc: { l: 'Faltas', k: 'fc', low: true },
  pm: { l: '+/−', k: 'pm', signed: true },
};
function mv(p, key, mode) {
  if (!p || !p.gp) return null;
  if (key === 'ftp') return pct(p.ftm, p.fta);
  if (key === 'min') return mode === 'tot' ? p.sec / 60 : mode === 'pg' ? p.sec / 60 / p.gp : p.sec / 60 / p.gp;
  if (key === 'net') { const on = per40(p.pm, p.sec), off = per40(p.offPm, p.offSec); return ok(on) && ok(off) ? on - off : on; }
  const v = p[MET[key].k];
  return mode === 'tot' ? v : mode === 'pg' ? v / (p.gp - p.partial || 1) : per40(v, p.sec);
}
function rank(A, id, key, mode, low) {
  const arr = Object.values(A.P).filter(p => p.gp > 0 && (key !== 'ftp' || p.fta > 0)).map(p => ({ id: p.id, v: mv(p, key, mode) })).filter(x => ok(x.v));
  arr.sort((a, b) => low ? a.v - b.v : b.v - a.v);
  const i = arr.findIndex(x => x.id === id); if (i < 0) return null;
  let r = i; while (r > 0 && arr[r - 1].v === arr[i].v) r--;
  return { r: r + 1, n: arr.length };
}

const S = {

};
function activeGames() {

/* ================= tooltip ================= */
const tip = $('#tip'); let tipT;
function showTip(html, x, y) {
  tip.innerHTML = html; tip.classList.add('show');
  const r = tip.getBoundingClientRect();
  let l = x + 14, t = y + 14;
  if (l + r.width > innerWidth - 8) l = x - r.width - 14;
  if (t + r.height > innerHeight - 8) t = y - r.height - 14;
  tip.style.left = Math.max(8, l) + 'px'; tip.style.top = Math.max(8, t) + 'px';
}
const hideTip = () => tip.classList.remove('show');
document.addEventListener('pointermove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (t) showTip(t.getAttribute('data-tip'), e.clientX, e.clientY); else if (!e.target.closest('[data-hover]')) hideTip();
});
document.addEventListener('pointerdown', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (t && e.pointerType !== 'mouse') { showTip(t.getAttribute('data-tip'), e.clientX, e.clientY); clearTimeout(tipT); tipT = setTimeout(hideTip, 2600); }
});
addEventListener('scroll', hideTip, { passive: true });

/* ================= chart mounting ================= */
let CHARTS = [];
function chart(fn, cls = '') { const id = 'c' + CHARTS.length; CHARTS.push({ id, fn }); return `<div class="chart ${cls}" id="${id}"></div>`; }
function mountCharts() { CHARTS.forEach(c => { const el = document.getElementById(c.id); if (el) { const W = Math.floor(el.clientWidth); if (W > 0) c.fn(el, W); } }); }
let rT, lastW = innerWidth;
addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rT); rT = setTimeout(mountCharts, 120); });

const card = (span, h, body, extra = '', sub = '') => `<section class="card ${span} fade"><div class="ch"><h3>${h}</h3>${sub ? `<span class="sub">${sub}</span>` : ''}<div class="sp"></div>${extra}</div>${body}</section>`;
const seg = (key, opts, val) => `<div class="seg">${opts.map(([v, l]) => `<button data-act="set" data-k="${key}" data-v="${v}" class="${String(val) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
const MODES = [['tot', 'Total'], ['pg', 'Por partido'], ['p40', "Por 40'"]];

/* ---------- vertical bars (one series) ---------- */
function vbars(el, W, o) {
  const { items, signed, avg, d = 0, H = 200 } = o;
  const pl = 34, pr = 8, pt = 22, pb = 40, iw = W - pl - pr, ih = H - pt - pb;
  const vals = items.map(i => i.v).filter(ok);
  let mx = Math.max(1, ...vals.map(v => Math.abs(v)));
  const step = niceStep(mx / 3); mx = Math.ceil(mx / step) * step;
  const mn = signed ? -mx : 0;
  const y = v => pt + (mx - v) / (mx - mn) * ih;
  const bw = iw / Math.max(items.length, 1), bW = Math.min(44, bw * .56);
  let s = `<svg width="${W}" height="${H}" role="img">`;
  for (let v = mn; v <= mx + 1e-9; v += step) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" class="${v === 0 ? 'gl0' : 'gl'}"/><text x="${pl - 8}" y="${y(v) + 3.5}" class="ax" text-anchor="end">${signed && v > 0 ? '+' : ''}${nf(v, step < 1 ? 1 : 0)}</text>`;
  items.forEach((it, i) => {
    const cx = pl + bw * i + bw / 2;
    if (ok(it.v)) {
      const y0 = y(0), y1 = y(it.v), top = Math.min(y0, y1), h = Math.abs(y1 - y0);
      const col = signed ? pmCol(it.v) : (it.color || 'var(--blue)');
      if (h > 0) s += `<path d="${roundBar(cx - bW / 2, top, bW, h, it.v >= 0)}" fill="${col}" ${it.ghost ? 'fill-opacity=".35" stroke="' + col + '" stroke-dasharray="3 2"' : ''}/>`;
      else s += `<line x1="${cx - bW / 2}" x2="${cx + bW / 2}" y1="${y0}" y2="${y0}" stroke="var(--text3)" stroke-width="2"/>`;
      const ly = it.v >= 0 ? y1 - 6 : y1 + 14;
      s += `<text x="${cx}" y="${ly}" class="vl" text-anchor="middle">${signed ? sgn(it.v, d) : nf(it.v, d)}</text>`;
    } else {
      s += `<text x="${cx}" y="${y(0) - 6}" class="ax" text-anchor="middle">—</text>`;
    }
    s += `<text x="${cx}" y="${H - pb + 16}" class="axs" text-anchor="middle">${esc(it.label)}</text>`;
    if (it.sub) s += `<text x="${cx}" y="${H - pb + 30}" class="ax" text-anchor="middle">${esc(it.sub)}</text>`;
    s += `<rect x="${pl + bw * i}" y="${pt - 12}" width="${bw}" height="${ih + 24}" fill="transparent" data-tip="${esc(it.tip || '')}"/>`;
  });
  if (ok(avg)) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--text2)" stroke-width="1" stroke-dasharray="4 4"/>`;
  el.innerHTML = s + '</svg>' + (ok(avg) ? `<div class="lg"><span><svg width="18" height="2"><line x1="0" x2="18" y1="1" y2="1" stroke="var(--text2)" stroke-dasharray="4 3"/></svg>Media ${signed ? sgn(avg, 1) : nf(avg, 1)}</span></div>` : '');
}
function niceStep(v) { if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
function roundBar(x, y, w, h, up) {
  const r = Math.min(4, w / 2, h);
  return up ? `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`
            : `M${x},${y}V${y + h - r}Q${x},${y + h} ${x + r},${y + h}H${x + w - r}Q${x + w},${y + h} ${x + w},${y + h - r}V${y}Z`;
}

/* ---------- horizontal diverging/plain list ---------- */
function hbars(rows, { signed, max, fmt = v => nf(v, 1), sub }) {
  const mx = max || Math.max(1e-9, ...rows.map(r => Math.abs(r.v || 0)));
  return rows.map(r => {
    const v = r.v || 0, w = Math.abs(v) / mx;
    const bar = signed
      ? `<span class="z"></span><i style="${v >= 0 ? 'left:50%' : 'right:50%'};width:${w * 50}%;background:${pmCol(v)};${r.dim ? 'opacity:.35' : ''}"></i>`
      : `<i style="left:0;width:${w * 100}%;background:${r.color || 'var(--blue)'};${r.dim ? 'opacity:.35' : ''}"></i>`;
    return `<div class="hb" ${r.tip ? `data-tip="${esc(r.tip)}"` : ''}><span class="n ${r.me ? 'me' : ''}">${esc(r.label)}</span><div class="t">${bar}</div><span class="v">${ok(r.v) ? fmt(r.v) : '—'}${r.sub ? `<small>${r.sub}</small>` : ''}</span></div>`;
  }).join('');
}

/* ---------- court ---------- */
function court(shots, colorFn, legend) {
  const L = 'var(--border2)';
  let s = `<svg class="court" viewBox="-7700 -1800 15400 10600" role="img">
  <rect x="-7500" y="-1575" width="15000" height="10375" rx="200" fill="var(--surface2)" stroke="${L}" stroke-width="40"/>
  <rect x="-2450" y="-1575" width="4900" height="5800" fill="none" stroke="${L}" stroke-width="40"/>
  <circle cx="0" cy="4225" r="1800" fill="none" stroke="${L}" stroke-width="40"/>
  <path d="M-6600,-1575V1416A6750,6750 0 0 0 6600,1416V-1575" fill="none" stroke="${L}" stroke-width="40"/>
  <path d="M-1250,0A1250,1250 0 0 0 1250,0" fill="none" stroke="${L}" stroke-width="40"/>

const ZN = { pin: 'Pintura', med: 'Media distancia', tri: 'Triple' };

/* ---------- gantt (stints) ---------- */
function gantt(el, W, G, rows, lw, scaleLen, noHead) {
  const L0 = scaleLen || G.len, rh = 26, top = noHead ? 0 : 18, H = rows.length * rh + top + 4, iw = W - lw - 4, x = t => lw + t / L0 * iw;
  let s = `<svg width="${W}" height="${H}" role="img">`;
  G.periods.forEach(p => {
    s += `<line x1="${x(p.start)}" x2="${x(p.start)}" y1="${top ? 16 : 0}" y2="${H}" class="gl"/>`;
    if (!noHead) s += `<text x="${x(p.start + p.len / 2)}" y="11" class="ax" text-anchor="middle">${pLabel(p.p)}</text>`;
  });
  s += `<line x1="${x(G.len)}" x2="${x(G.len)}" y1="${top ? 16 : 0}" y2="${H}" class="gl"/>`;
  rows.forEach((r, i) => {
    const yy = top + 2 + i * rh;
    s += `<text x="${lw - 10}" y="${yy + rh / 2 + 4}" text-anchor="end" class="rl ${r.me ? 'me' : ''}">${esc(r.label)}</text>`;
    s += `<rect x="${lw}" y="${yy + rh / 2 - .5}" width="${iw}" height="1" class="trk"/>`;
    (r.stints || []).forEach(st => {

      const tp = `<b>${esc(r.full || r.label)}</b><br><span class="tm">${pLabel(st.sp)} → ${pLabel(st.ep)} · ${mmss(st.e - st.s)}</span><br>${sgn(st.pm)} en pista`;
      s += `<rect x="${x1}" y="${yy + 4}" width="${w}" height="${rh - 8}" rx="3" fill="${pmCol(st.pm)}" fill-opacity="${st.pm === 0 ? .55 : .9}" data-tip="${esc(tp)}"/>`;
      if (w > 28) s += `<text x="${x1 + w / 2}" y="${yy + rh / 2 + 3.5}" class="vlw" text-anchor="middle">${sgn(st.pm)}</text>`;
    });
    (r.fouls || []).forEach((f, k) => {
      s += `<g data-tip="${esc(`<b>Falta ${k + 1}</b><br><span class="tm">${pLabel(f.p)} · ${mmss(f.t - G.periods.find(q => q.p === f.p).start)}</span>`)}"><circle cx="${x(f.t)}" cy="${yy + 4}" r="5" fill="var(--surface)" stroke="var(--text)" stroke-width="1.4"/><text x="${x(f.t)}" y="${yy + 7}" text-anchor="middle" style="font:700 7.5px var(--font);fill:var(--text)">${k + 1}</text></g>`;
    });
  });
  el.innerHTML = s + '</svg>';
}

/* ---------- score flow ---------- */
function flowChart(el, W, G) {
  const H = 230, pl = 32, pr = 8, pt = 24, pb = 10, iw = W - pl - pr, ih = H - pt - pb;
  const F = G.flow;
  let yM = Math.max(4, ...F.map(f => Math.abs(f.us - f.them))); const st = niceStep(yM / 2.5); yM = Math.ceil(yM / st) * st;
  const x = t => pl + t / G.len * iw, y = d => pt + (yM - d) / (2 * yM) * ih;
  let d = `M${x(0)},${y(0)}`; F.forEach(f => d += `H${x(f.t).toFixed(1)}V${y(f.us - f.them).toFixed(1)}`); d += `H${x(G.len)}`;
  const area = d + `V${y(0)}H${x(0)}Z`, id = 'f' + Math.random().toString(36).slice(2, 7);
  let s = `<svg width="${W}" height="${H}" role="img"><defs><clipPath id="${id}a"><rect x="0" y="0" width="${W}" height="${y(0)}"/></clipPath><clipPath id="${id}b"><rect x="0" y="${y(0)}" width="${W}" height="${H}"/></clipPath></defs>`;
  for (let v = -yM; v <= yM; v += st) if (v) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${pl - 8}" y="${y(v) + 3.5}" class="ax" text-anchor="end">${sgn(v)}</text>`;
  G.periods.forEach((p, i) => { if (i) s += `<line x1="${x(p.start)}" x2="${x(p.start)}" y1="${pt - 8}" y2="${H - pb}" class="gl"/>`; s += `<text x="${x(p.start + p.len / 2)}" y="12" class="ax" text-anchor="middle">${pLabel(p.p)}</text>`; });
  s += `<path d="${area}" fill="var(--blue)" fill-opacity=".18" clip-path="url(#${id}a)"/><path d="${area}" fill="var(--red)" fill-opacity=".18" clip-path="url(#${id}b)"/>`;
  s += `<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" class="gl0"/>`;
  s += `<path d="${d}" fill="none" stroke="var(--text)" stroke-width="1.6" stroke-linejoin="round"/>`;
  s += `<line class="cl" y1="${pt - 8}" y2="${H - pb}" stroke="var(--text2)" stroke-width="1" opacity="0"/><circle class="cd" r="4.5" fill="var(--text)" stroke="var(--surface)" stroke-width="2" opacity="0"/>`;
  s += `<rect data-hover="1" x="${pl}" y="0" width="${iw}" height="${H}" fill="transparent"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), cl = svg.querySelector('.cl'), cd = svg.querySelector('.cd'), hit = svg.querySelector('[data-hover]');
  const mv_ = e => {
    const r = svg.getBoundingClientRect(), t = clamp((e.clientX - r.left - pl) / iw * G.len, 0, G.len);
    let f = F[0]; for (const q of F) { if (q.t <= t) f = q; else break; }
    const per = G.periods.find(p => t >= p.start && t < p.start + p.len) || G.periods[G.periods.length - 1];
    const xx = x(t), dd = f.us - f.them;
    cl.setAttribute('x1', xx); cl.setAttribute('x2', xx); cl.setAttribute('opacity', 1);
    cd.setAttribute('cx', xx); cd.setAttribute('cy', y(dd)); cd.setAttribute('opacity', 1);
    const sc = G.scores.filter(z => Math.abs(z.t - f.t) < 1 && f.t > 0).map(z => `${z.us ? '' : '<span class="tm">'}${esc(z.name)} +${z.v}${z.us ? '' : '</span>'}`).join('<br>');
    showTip(`<b>${pLabel(per.p)} · ${mmss(per.start + per.len - t)}</b><br>Claret ${f.us} – ${f.them} ${esc(G.code)} <b>${sgn(dd)}</b>${sc ? '<br>' + sc : ''}`, e.clientX, e.clientY);
  };
  hit.addEventListener('pointermove', mv_); hit.addEventListener('pointerdown', mv_);
  hit.addEventListener('pointerleave', () => { cl.setAttribute('opacity', 0); cd.setAttribute('opacity', 0); hideTip(); });
}

/* ---------- presence curve ---------- */
function presence(el, W, games, id) {
  const gs = games.filter(g => g.detail && g.players[id]);
  if (!gs.length) { el.innerHTML = '<div class="empty">Sin datos</div>'; return; }
  const maxLen = Math.max(...gs.map(g => g.len)), step = 15;
  const pts = [];
  for (let t = 0; t <= maxLen; t += step) {
    const elig = gs.filter(g => t < g.len || (t === g.len && t > 0));
    const on = elig.filter(g => (g.stints[id] || []).some(s => t >= s.s && t < s.e || (t === g.len && s.e === g.len))).length;
    pts.push({ t, v: elig.length ? on / elig.length * 100 : null, n: elig.length, on });
  }
  const H = 170, pl = 34, pr = 8, pt = 22, pb = 10, iw = W - pl - pr, ih = H - pt - pb;
  const x = t => pl + t / maxLen * iw, y = v => pt + (100 - v) / 100 * ih;
  const pr0 = gs.reduce((a, g) => g.periods.length > a.periods.length ? g : a, gs[0]).periods;
  let s = `<svg width="${W}" height="${H}" role="img">`;
  [0, 50, 100].forEach(v => s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" class="${v ? 'gl' : 'gl0'}"/><text x="${pl - 8}" y="${y(v) + 3.5}" class="ax" text-anchor="end">${v}%</text>`);
  pr0.forEach((p, i) => { if (i) s += `<line x1="${x(p.start)}" x2="${x(p.start)}" y1="${pt - 8}" y2="${H - pb}" class="gl"/>`; s += `<text x="${x(p.start + p.len / 2)}" y="12" class="ax" text-anchor="middle">${pLabel(p.p)}</text>`; });
  let d = '', a = '';
  pts.forEach((p, i) => { if (p.v == null) return; d += (d ? 'L' : 'M') + x(p.t).toFixed(1) + ',' + y(p.v).toFixed(1); });
  const valid = pts.filter(p => p.v != null);
  a = d + `L${x(valid[valid.length - 1].t)},${y(0)}L${x(0)},${y(0)}Z`;
  s += `<path d="${a}" fill="var(--blue)" fill-opacity=".16"/><path d="${d}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<line class="cl" y1="${pt - 8}" y2="${H - pb}" stroke="var(--text2)" stroke-width="1" opacity="0"/><circle class="cd" r="4.5" fill="var(--blue)" stroke="var(--surface)" stroke-width="2" opacity="0"/>`;
  s += `<rect data-hover="1" x="${pl}" y="0" width="${iw}" height="${H}" fill="transparent"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), cl = svg.querySelector('.cl'), cd = svg.querySelector('.cd'), hit = svg.querySelector('[data-hover]');
  const mv_ = e => {
    const r = svg.getBoundingClientRect(), t = clamp((e.clientX - r.left - pl) / iw * maxLen, 0, maxLen);
    const p = valid.reduce((b, q) => Math.abs(q.t - t) < Math.abs(b.t - t) ? q : b, valid[0]);
    const per = pr0.find(q => p.t >= q.start && p.t < q.start + q.len) || pr0[pr0.length - 1];
    cl.setAttribute('x1', x(p.t)); cl.setAttribute('x2', x(p.t)); cl.setAttribute('opacity', 1);
    cd.setAttribute('cx', x(p.t)); cd.setAttribute('cy', y(p.v)); cd.setAttribute('opacity', 1);
    showTip(`<b>${pLabel(per.p)} · ${mmss(per.start + per.len - p.t)}</b><br>En pista en ${p.on} de ${p.n} partidos (${nf(p.v, 0)}%)`, e.clientX, e.clientY);
  };
  hit.addEventListener('pointermove', mv_); hit.addEventListener('pointerdown', mv_);
  hit.addEventListener('pointerleave', () => { cl.setAttribute('opacity', 0); cd.setAttribute('opacity', 0); hideTip(); });
}

/* ---------- JUGADORA ---------- */
function viewJugadora() {

  const fw = mine.length >= 4 ? 3 : (mine.length >= 2 ? 1 : 0);
  const FA = fw ? agg(mine.slice(-fw)) : null, fp = FA && FA.P[p.id];

  const tile = (key, lab, opts = {}) => {
    const v = key === 'min' ? (md === 'tot' ? p.sec / 60 : p.sec / 60 / p.gp) : mv(p, key, md);
    const mdR = key === 'min' ? (md === 'tot' ? 'tot' : 'pg') : md;
    const r = rank(A, p.id, key, mdR, MET[key] && MET[key].low);
    let val;
    if (key === 'min') val = md === 'tot' ? mmss(p.sec) : nf(v, 1);
    else if (key === 'ftp') val = ok(v) ? nf(v, 0) + '<small>%</small>' : '—';
    else if (key === 'pm') val = sgn(v, md === 'tot' ? 0 : 1);
    else val = nf(v, md === 'tot' ? 0 : 1);
    if (opts.suffix) val += `<small>${opts.suffix}</small>`;
    let f = '';
    if (fp && md !== 'tot') {
      const fv = key === 'min' ? fp.sec / 60 / fp.gp : mv(fp, key, md);
      if (ok(fv) && ok(v)) {
        const df = fv - v, low = MET[key] && MET[key].low, th = Math.max(Math.abs(v) * .08, .2);
        const dir = Math.abs(df) < th ? '' : ((df > 0) !== !!low ? 'up' : 'dn');

  };
  const kp = `<div class="kpis fade">

  const head = `<div class="phead"><div class="psel"><select data-act="player">${playerOptions(A, p.id)}</select></div>
